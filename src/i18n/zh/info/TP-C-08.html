<h2>阅读：把句子放在合适的位置</h2><div class="sub2 ko">문장 넣기</div><h3>这种题型 (第59~60题)</h3><p>给你1个句子。选出它应该放的位置：㉠㉡㉢㉣。然后还有1道关于内容的题。</p><p>看给出句子里的连接词和指示词 (<span class="ko">그때, 그 이유는, 하지만</span>)：它必须和前一句连得上。</p><h3>词汇</h3><div class="terms"><div><span class="ko">그때</span> <span class="r">geuttae</span><span class="m">那时</span></div><div><span class="ko">그 이유는</span> <span class="r">geu iyuneun</span><span class="m">原因是</span></div><div><span class="ko">하지만</span> <span class="r">hajiman</span><span class="m">但是</span></div><div><span class="ko">덕분에</span> <span class="r">deokbune</span><span class="m">多亏 (好的结果)</span></div></div>
