<h2>TOPIK I模拟考试</h2><div class="sub2 ko">TOPIK I 미니 모의고사</div><h3>怎么做</h3><p>20道题：听力10 + 阅读10，每种题型一道，从题库中随机抽取。按 <b>新试卷</b> <span class="ko">새 시험지</span> 换一套试卷。自己计时，大约30分钟。答题后，解析会告诉你该复习哪一课。</p><p>总分显示在页面最后。16分以上 = 可以考2级，8~15 = 1级，更低 = 先复习基础课 (这只是大概的参考)。</p><table class="facts"><tr><th>第1~10题</th><td>听力：回答、地点、话题、图片、内容、中心思想、广播、采访</td></tr><tr><th>第11~20题</th><td>阅读：话题、填空、通知、内容、顺序、短信、长文章</td></tr></table>
