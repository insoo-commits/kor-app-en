<h2>听力：这个人接下来要做什么</h2><div class="sub2 ko">이어서 할 행동</div><h3>这种题型 (第9~12题)</h3><p>选出女人在对话之后马上要做的事。答案常在她的最后一句：<span class="ko">그럼 제가 먼저 -을게요</span>。</p><p>注意：她 <span class="ko">이미</span> (已经) 做过的事和 <span class="ko">이따가</span> (过一会儿) 要做的事都不是答案。</p><h3>词汇</h3><div class="terms"><div><span class="ko">-을게요</span> <span class="r">-eulgeyo</span><span class="m">我会……</span></div><div><span class="ko">먼저</span> <span class="r">meonjeo</span><span class="m">先，首先</span></div><div><span class="ko">일단</span> <span class="r">ildan</span><span class="m">首先</span></div><div><span class="ko">이따가</span> <span class="r">ittaga</span><span class="m">过一会儿</span></div><div><span class="ko">미리</span> <span class="r">miri</span><span class="m">提前，预先</span></div><div><span class="ko">이미</span> <span class="r">imi</span><span class="m">已经</span></div></div>
