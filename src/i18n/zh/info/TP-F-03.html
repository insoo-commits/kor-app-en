<h2>阅读：广告是关于什么的?</h2><div class="sub2 ko">광고·안내문 화제</div><h3>这种题型 (第5~8题)</h3><p>1~2行的简短广告。选出它是关于什么的：产品、地点、宣传活动、警告、使用方法。</p><p>找关键词：<span class="ko">마셔도, 맛</span> → 饮料，<span class="ko">아껴 쓰세요</span> → 宣传活动。</p><h3>词汇</h3><div class="terms"><div><span class="ko">캠페인</span> <span class="r">kaempein</span><span class="m">宣传活动</span></div><div><span class="ko">상품 안내</span> <span class="r">sangpum annae</span><span class="m">产品信息</span></div><div><span class="ko">이용 방법</span> <span class="r">iyong bangbeop</span><span class="m">使用方法</span></div><div><span class="ko">주의 사항</span> <span class="r">juui sahang</span><span class="m">注意事项</span></div><div><span class="ko">교환</span> <span class="r">gyohwan</span><span class="m">交换</span></div></div>
