<h2>阅读：找出主题</h2><div class="sub2 ko">주제 찾기</div><h3>这种题型 (第35~38题)</h3><p>读一段文字，选出 <span class="ko">주제</span> (作者想说的)。通常在 <span class="ko">따라서, 결국, 무엇보다</span> 后面，或在有 <span class="ko">-아야 한다, 중요하다</span> 的句子里。</p><p>注意：细节性的选项可能是对的，但不是主题。</p><h3>词汇</h3><div class="terms"><div><span class="ko">주제</span> <span class="r">juje</span><span class="m">主题</span></div><div><span class="ko">따라서</span> <span class="r">ttaraseo</span><span class="m">因此</span></div><div><span class="ko">무엇보다</span> <span class="r">mueotboda</span><span class="m">最重要的是</span></div><div><span class="ko">-아야 할 것이다</span> <span class="r">-aya hal geosida</span><span class="m">应该……</span></div></div>
