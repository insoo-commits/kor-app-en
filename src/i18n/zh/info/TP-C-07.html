<h2>阅读：排列句子顺序</h2><div class="sub2 ko">순서 배열</div><h3>这种题型 (第57~58题)</h3><p>有4个句子 (가)(나)(다)(라)。选出正确的顺序。</p><div class="two"><div><h3>怎么做</h3><p>1. 第一句不会以 <span class="ko">그래서, 그런데, 그리고</span> 或 <span class="ko">이것, 그곳</span> 开头。</p><p>2. 选项里第一句只有2种可能：选一个，再检查其余的。</p></div><div><h3>表示顺序的词</h3><p><span class="ko">먼저</span> 首先 · <span class="ko">그다음에</span> 然后 · <span class="ko">그 후</span> 之后 · <span class="ko">마지막으로</span> 最后</p></div></div><h3>词汇</h3><div class="terms"><div><span class="ko">먼저</span> <span class="r">meonjeo</span><span class="m">先，首先</span></div><div><span class="ko">그다음에</span> <span class="r">geudaeume</span><span class="m">接下来</span></div><div><span class="ko">그 후</span> <span class="r">geu hu</span><span class="m">之后</span></div><div><span class="ko">마지막으로</span> <span class="r">majimageuro</span><span class="m">最后</span></div><div><span class="ko">그곳</span> <span class="r">geugot</span><span class="m">那个地方</span></div></div>
