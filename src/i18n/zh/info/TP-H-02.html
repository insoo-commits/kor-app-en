<h2>TOPIK II模拟考试</h2><div class="sub2 ko">TOPIK II 미니 모의고사</div><h3>怎么做</h3><p>3~4级的20道题：听力10 + 阅读10，每种题型一道，从题库中随机抽取。按 <b>新试卷</b> <span class="ko">새 시험지</span> 换一套试卷。自己计时，大约40分钟。解析会告诉你该复习哪一课。</p><p>16分以上 = 接近4级，10~15 = 3级 (大概的参考)。写作在下一课练习。</p><table class="facts"><tr><th>第1~10题</th><td>听力：图表、接下来会说什么、行动、新闻、中心思想、采访、讨论、讲座</td></tr><tr><th>第11~20题</th><td>阅读：语法、意思相近、广告、图表、顺序、新闻标题、主题、插入句子、小说</td></tr></table>
