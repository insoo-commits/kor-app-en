<h2>阅读：填空中的语法</h2><div class="sub2 ko">빈칸 문법</div><h3>这种题型 (第1~2题)</h3><p>为空白处选择语法。看两部分是怎么连接的：原因、转折、目的、时间。</p><table class="facts"><tr><th><span class="ko">-는 바람에</span></th><td>因为 (不好的事，不是故意的)</td></tr><tr><th><span class="ko">-느라고</span></th><td>因为忙着……</td></tr><tr><th><span class="ko">-다가</span></th><td>正在……的时候，然后 (变化)</td></tr><tr><th><span class="ko">-도록</span></th><td>为了让……</td></tr><tr><th><span class="ko">-는 대신에</span></th><td>不……而……，代替……</td></tr><tr><th><span class="ko">-(으)니까</span></th><td>因为 (+ 命令)</td></tr></table><h3>词汇</h3><div class="terms"><div><span class="ko">바람</span> <span class="r">baram</span><span class="m">因为 (意外地)</span></div><div><span class="ko">대신</span> <span class="r">daesin</span><span class="m">代替</span></div><div><span class="ko">늦잠</span> <span class="r">neutjam</span><span class="m">睡过头</span></div><div><span class="ko">놓치다</span> <span class="r">nochida</span><span class="m">错过</span></div></div>
