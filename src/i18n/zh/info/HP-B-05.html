<h2>听力练习的用法</h2><div class="sub2 ko">듣기연습 쓰는 법</div><h3>先听</h3><p><span class="ko">듣기연습</span> 有校园广播、故事、对话、通知和新闻。每课从一篇<b>原文</b>开始。</p><table class="facts"><tr><th>① 全部听一遍</th><td>点 "播放本课" <span class="ko">묶음 재생</span>：从头到尾听原文。点 "显示原文" <span class="ko">본문 보기</span> 之前，原文是隐藏的。</td></tr><tr><th>② 逐句听</th><td>点每一行的 🔊，或用 ← → 再听一遍。</td></tr><tr><th>③ 单词</th><td>单词标签 <span class="ko">단어</span>：本课的关键词做成单词卡。</td></tr><tr><th>④ 问题</th><td>页面下方：关于内容的问题 (谁、在哪里、多少钱)。</td></tr></table><figure class="shot"><img class="hl-l" src="img/help/listening.jpg" width="780" height="1120" loading="lazy" alt=""><img class="hl-d" src="img/help/listening-d.jpg" width="780" height="1120" loading="lazy" alt=""><figcaption>先听，再点 "显示原文" <span class="ko">먼저 듣고 나서 본문 보기</span></figcaption></figure><h3>语音</h3><p>在对话中，第一个人是女声，第二个人是男声。关闭中文语音 (K) 就只听韩语。</p>
