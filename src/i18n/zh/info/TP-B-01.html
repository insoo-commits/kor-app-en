<h2>听力：是/否回答</h2><div class="sub2 ko">알맞은 대답: 예/아니요 질문</div><h3>这种题型 (第1~2题)</h3><p>你会听到一个简短的问题，用 <span class="ko">네</span> 或 <span class="ko">아니요</span> 回答。</p><table class="facts"><tr><th><span class="ko">-아요/어요?</span></th><td><span class="ko">네, -아요.</span> / <span class="ko">아니요, 안 -아요.</span></td></tr><tr><th><span class="ko">-이에요/예요?</span></th><td><span class="ko">네, -이에요.</span> / <span class="ko">아니요, -이/가 아니에요.</span></td></tr><tr><th><span class="ko">있어요?</span></th><td><span class="ko">네, 있어요.</span> / <span class="ko">아니요, 없어요.</span></td></tr></table><h3>注意</h3><p>错误选项常常是 <span class="ko">네</span> 配否定动词，或者换了名词。네/아니요 和动词都要检查。</p><h3>词汇</h3><div class="terms"><div><span class="ko">네</span> <span class="r">ne</span><span class="m">是</span></div><div><span class="ko">아니요</span> <span class="r">aniyo</span><span class="m">不是</span></div><div><span class="ko">안</span> <span class="r">an</span><span class="m">不 (放在动词前)</span></div><div><span class="ko">아니다</span> <span class="r">anida</span><span class="m">不是</span></div><div><span class="ko">있다</span> <span class="r">itda</span><span class="m">有</span></div><div><span class="ko">없다</span> <span class="r">eopda</span><span class="m">没有</span></div></div>
