<h2>听力：采访，谁在说，为什么说</h2><div class="sub2 ko">인터뷰: 말하는 사람과 의도</div><h3>这种题型 (第25~30题)</h3><p>问题：<span class="ko">남자는 누구인지</span> (职业)、<span class="ko">남자의 의도</span> (他为什么这样说：提出问题、提出解决办法、说服、强调……)。</p><p>从工作用语可以判断职业：<span class="ko">환자, 진료</span> → 医生，<span class="ko">강의, 학점</span> → 教授。</p><h3>词汇</h3><div class="terms"><div><span class="ko">의도</span> <span class="r">uido</span><span class="m">意图</span></div><div><span class="ko">제안하다</span> <span class="r">jeanhada</span><span class="m">建议，提议</span></div><div><span class="ko">설득하다</span> <span class="r">seoldeukada</span><span class="m">说服</span></div><div><span class="ko">강조하다</span> <span class="r">gangjohada</span><span class="m">强调</span></div><div><span class="ko">문제를 제기하다</span> <span class="r">munjereul jegihada</span><span class="m">提出问题</span></div></div>
