<h2>阅读：短信·邮件的目的</h2><div class="sub2 ko">문자·이메일: 목적 찾기</div><h3>这种题型 (第61~64题)</h3><p>读一条短信或一封邮件。问题：<span class="ko">왜 이 글을 썼는지</span> (感谢、邀请、请求、通知、道歉) 和内容。</p><p>目的常在结尾：<span class="ko">-아/어 주세요, 오세요, 감사합니다, 죄송합니다</span>。</p><h3>词汇</h3><div class="terms"><div><span class="ko">초대하다</span> <span class="r">chodaehada</span><span class="m">邀请</span></div><div><span class="ko">부탁하다</span> <span class="r">butakada</span><span class="m">请求帮忙</span></div><div><span class="ko">감사하다</span> <span class="r">gamsahada</span><span class="m">感谢</span></div><div><span class="ko">알리다</span> <span class="r">allida</span><span class="m">通知</span></div><div><span class="ko">확인하다</span> <span class="r">hwaginhada</span><span class="m">检查</span></div><div><span class="ko">사과하다</span> <span class="r">sagwahada</span><span class="m">道歉</span></div></div>
