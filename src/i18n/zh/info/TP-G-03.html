<h2>TOPIK II 3级语法</h2><div class="sub2 ko">TOPIK II 3급 문법</div><h3>学习方法</h3><p>把意思相近的成对地记，并记住它们的区别。</p><table class="facts"><tr><th><span class="ko">-는 바람에</span></th><td>因为 (意外，不好的结果)</td></tr><tr><th><span class="ko">-느라고</span></th><td>因为忙着…… (不好的结果)</td></tr><tr><th><span class="ko">-(으)ㄹ 뿐만 아니라</span></th><td>不仅……而且……</td></tr><tr><th><span class="ko">-더라도</span></th><td>即使……</td></tr><tr><th><span class="ko">-다가</span></th><td>正在……的时候，然后变化</td></tr><tr><th><span class="ko">-도록</span></th><td>为了让……</td></tr><tr><th><span class="ko">-는 동안</span></th><td>在……的时候</td></tr><tr><th><span class="ko">-(으)ㄴ 지</span></th><td>自从……以来 (时间过去了)</td></tr></table>
