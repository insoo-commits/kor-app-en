<h2>陷阱选项</h2><div class="sub2 ko">함정 선택지 분석</div><h3>常见的陷阱</h3><p>知道错误选项的规律，就能很快排除它们。</p><table class="facts"><tr><th>① 听到的词一样</th><td>有你听到的词，但意思不同</td></tr><tr><th>② 换了人</th><td>是男人做的 → 选项说是女人做的</td></tr><tr><th>③ 换了时间</th><td><span class="ko">했다</span> (做了) ↔ <span class="ko">할 것이다</span> (将要做)</td></tr><tr><th>④ 说得太绝对</th><td>文章没说的 <span class="ko">항상, 모두, 절대, 반드시</span></td></tr><tr><th>⑤ 部分正确</th><td>一半对，一半错</td></tr><tr><th>⑥ 换了数字</th><td>日期、价格、数量</td></tr></table><h3>词汇</h3><div class="terms"><div><span class="ko">함정</span> <span class="r">hamjeong</span><span class="m">陷阱</span></div><div><span class="ko">항상</span> <span class="r">hangsang</span><span class="m">总是</span></div><div><span class="ko">모두</span> <span class="r">modu</span><span class="m">全部</span></div><div><span class="ko">절대</span> <span class="r">jeoldae</span><span class="m">绝对</span></div><div><span class="ko">반드시</span> <span class="r">bandeusi</span><span class="m">一定</span></div><div><span class="ko">일부</span> <span class="r">ilbu</span><span class="m">一部分</span></div></div>
