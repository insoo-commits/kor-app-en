<h2>听力：选择一致的内容</h2><div class="sub2 ko">대화 내용과 같은 것</div><h3>这种题型 (第17~21题)</h3><p>听3~4句话的对话，选出和听到的内容一致的一项。</p><div class="two"><div><h3>怎么做</h3><p>1. 先读选项。2. 简单记笔记：男人做什么，女人做什么。</p></div><div><h3>注意</h3><p>错误选项会换人 (男 ↔ 女)、换时间 (<span class="ko">-았어요</span> 已经做了 ↔ <span class="ko">-(으)ㄹ 거예요</span> 将要做) 或换地点。</p></div></div><h3>词汇</h3><div class="terms"><div><span class="ko">남자</span> <span class="r">namja</span><span class="m">男人</span></div><div><span class="ko">여자</span> <span class="r">yeoja</span><span class="m">女人</span></div><div><span class="ko">같이</span> <span class="r">gachi</span><span class="m">一起</span></div><div><span class="ko">먼저</span> <span class="r">meonjeo</span><span class="m">先，首先</span></div><div><span class="ko">나중에</span> <span class="r">najunge</span><span class="m">以后，后来</span></div><div><span class="ko">-(으)ㄹ 거예요</span> <span class="r">-(eu)l geoyeyo</span><span class="m">将要……</span></div></div>
