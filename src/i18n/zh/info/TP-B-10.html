<h2>听力：原因和意图</h2><div class="sub2 ko">대화: 이유와 의도</div><h3>这种题型 (第27~28题)</h3><p>较长的对话，2道题：<span class="ko">남자가 전화한 이유</span> (男人打电话的原因) / <span class="ko">무엇을 하려고 하는지</span> (打算做什么) 和内容。</p><p>注意听 <span class="ko">-아서/어서</span>、<span class="ko">-(으)니까</span> (因为)、<span class="ko">-(으)려고 하다</span> (打算)。</p><h3>词汇</h3><div class="terms"><div><span class="ko">-아서</span> <span class="r">-aseo</span><span class="m">因为</span></div><div><span class="ko">-(으)니까</span> <span class="r">-(eu)nikka</span><span class="m">因为，既然</span></div><div><span class="ko">-(으)려고</span> <span class="r">-(eu)ryeogo</span><span class="m">为了</span></div><div><span class="ko">부탁하다</span> <span class="r">butakada</span><span class="m">请求帮忙</span></div><div><span class="ko">물어보다</span> <span class="r">mureoboda</span><span class="m">问，询问</span></div><div><span class="ko">바꾸다</span> <span class="r">bakkuda</span><span class="m">换，改变</span></div></div>
