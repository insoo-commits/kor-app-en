<h2>ໄວຍາກອນ TOPIK II ລະດັບ 3</h2><div class="sub2 ko">TOPIK II 3급 문법</div><h3>ວິທີຮຽນ</h3><p>ຮຽນເປັນຄູ່ທີ່ມີຄວາມໝາຍຄ້າຍກັນ ແລະ ຈື່ຄວາມແຕກຕ່າງ.</p><table class="facts"><tr><th><span class="ko">-는 바람에</span></th><td>ຍ້ອນ (ໂດຍບັງເອີນ, ຜົນບໍ່ດີ)</td></tr><tr><th><span class="ko">-느라고</span></th><td>ເພາະມົວແຕ່… (ຜົນບໍ່ດີ)</td></tr><tr><th><span class="ko">-(으)ㄹ 뿐만 아니라</span></th><td>ບໍ່ພຽງແຕ່… ແຕ່ຍັງ…</td></tr><tr><th><span class="ko">-더라도</span></th><td>ເຖິງແມ່ນວ່າ…</td></tr><tr><th><span class="ko">-다가</span></th><td>ກຳລັງ… ແລ້ວປ່ຽນ</td></tr><tr><th><span class="ko">-도록</span></th><td>ເພື່ອໃຫ້…</td></tr><tr><th><span class="ko">-는 동안</span></th><td>ໃນຂະນະທີ່…</td></tr><tr><th><span class="ko">-(으)ㄴ 지</span></th><td>ນັບແຕ່… (ເວລາຜ່ານໄປ)</td></tr></table>
