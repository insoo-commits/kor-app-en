<h2>ການອ່ານ: ເວົ້າເລື່ອງຫຍັງ?</h2><div class="sub2 ko">화제 고르기</div><h3>ປະເພດຄຳຖາມນີ້ (ຂໍ້ 31~33)</h3><p>ອ່ານ 2 ປະໂຫຍກສັ້ນ ແລ້ວເລືອກຫົວຂໍ້. ຊອກຄຳທີ່ຢູ່ກຸ່ມດຽວກັນ: <span class="ko">사과, 바나나</span> → <span class="ko">과일</span>.</p><h3>ຄຳສັບ</h3><div class="terms"><div><span class="ko">과일</span> <span class="r">gwail</span><span class="m">ໝາກໄມ້</span></div><div><span class="ko">운동</span> <span class="r">undong</span><span class="m">ການອອກກຳລັງກາຍ, ກິລາ</span></div><div><span class="ko">날씨</span> <span class="r">nalssi</span><span class="m">ອາກາດ</span></div><div><span class="ko">가족</span> <span class="r">gajok</span><span class="m">ຄອບຄົວ</span></div><div><span class="ko">직업</span> <span class="r">jigeop</span><span class="m">ວຽກ</span></div><div><span class="ko">주말</span> <span class="r">jumal</span><span class="m">ທ້າຍອາທິດ</span></div><div><span class="ko">고향</span> <span class="r">gohyang</span><span class="m">ບ້ານເກີດ</span></div></div>
