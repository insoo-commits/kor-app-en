<h2>ການຟັງ: ການສຳພາດ</h2><div class="sub2 ko">인터뷰 듣기</div><h3>ປະເພດຄຳຖາມນີ້ (ຂໍ້ 29~30)</h3><p>ການສຳພາດຄົນເຮັດວຽກ. ຄຳຖາມ: ເປັນຫຍັງຈຶ່ງເລີ່ມວຽກນີ້ (<span class="ko">계기</span>) ແລະ ເນື້ອໃນ.</p><p>ເຫດຜົນມັກມາຫຼັງ <span class="ko">처음에</span>, <span class="ko">그때</span>, <span class="ko">-아서</span>.</p><h3>ຄຳສັບ</h3><div class="terms"><div><span class="ko">처음</span> <span class="r">cheoeum</span><span class="m">ທຳອິດ, ຕອນຕົ້ນ</span></div><div><span class="ko">계기</span> <span class="r">gyegi</span><span class="m">ເຫດຜົນທີ່ເລີ່ມ</span></div><div><span class="ko">보람</span> <span class="r">boram</span><span class="m">ຄວາມພູມໃຈໃນວຽກ</span></div><div><span class="ko">앞으로</span> <span class="r">apeuro</span><span class="m">ຕັ້ງແຕ່ນີ້ໄປ</span></div><div><span class="ko">손님</span> <span class="r">sonnim</span><span class="m">ລູກຄ້າ</span></div></div>
