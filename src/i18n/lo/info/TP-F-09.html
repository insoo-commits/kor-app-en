<h2>ການອ່ານ: ແຊກປະໂຫຍກ (TOPIK II)</h2><div class="sub2 ko">문장 넣기</div><h3>ປະເພດຄຳຖາມນີ້ (ຂໍ້ 39~41)</h3><p>ເລືອກບ່ອນ ㉠~㉣ ທີ່ປະໂຫຍກ [보기] ເຂົ້າໄດ້. ຊອກວ່າຄຳຊີ້ໃນປະໂຫຍກ (<span class="ko">이는, 이를 위해, 그럼에도, 이와 달리</span>) ຊີ້ໄປຫາຫຍັງ.</p><h3>ຄຳສັບ</h3><div class="terms"><div><span class="ko">이는</span> <span class="r">ineun</span><span class="m">ເທື່ອນີ້</span></div><div><span class="ko">이를 위해</span> <span class="r">ireul wihae</span><span class="m">ເພື່ອສິ່ງນີ້</span></div><div><span class="ko">그럼에도</span> <span class="r">geureomedo</span><span class="m">ເຖິງຢ່າງນັ້ນ</span></div><div><span class="ko">이와 달리</span> <span class="r">iwa dalli</span><span class="m">ຕ່າງຈາກນີ້</span></div></div>
