<h2>Đọc: chèn câu (TOPIK II)</h2><div class="sub2 ko">문장 넣기</div><h3>Dạng câu hỏi này (câu 39~41)</h3><p>Chọn vị trí ㉠~㉣ phù hợp với câu [보기]. Hãy tìm xem từ chỉ định trong câu (<span class="ko">이는, 이를 위해, 그럼에도, 이와 달리</span>) chỉ đến điều gì.</p><h3>Từ vựng</h3><div class="terms"><div><span class="ko">이는</span> <span class="r">ineun</span><span class="m">điều này</span></div><div><span class="ko">이를 위해</span> <span class="r">ireul wihae</span><span class="m">vì điều này</span></div><div><span class="ko">그럼에도</span> <span class="r">geureomedo</span><span class="m">dù vậy</span></div><div><span class="ko">이와 달리</span> <span class="r">iwa dalli</span><span class="m">khác với điều này</span></div></div>
